<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MenuLens</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="panel-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 21h10"/><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/>
          <path d="M11.38 12a2.4 2.4 0 0 1-.4-4.77 2.4 2.4 0 0 1 3.2-2.77 2.4 2.4 0 0 1 3.47-.63 2.4 2.4 0 0 1 3.37 3.37 2.4 2.4 0 0 1-1.1 3.7 2.51 2.51 0 0 1 .03 1.1"/>
          <path d="m13 12 4-4"/><path d="M10.9 7.25A3.99 3.99 0 0 0 4 10c0 .73.2 1.41.54 2"/>
        </svg>
      </span>
      <span class="brand-name">MenuLens</span>
    </div>
    <p id="restaurant" class="restaurant">No restaurant yet</p>
    <div class="meta">
      <span id="tier" class="pill">Browsing</span>
      <span id="count" class="count"><span class="dot" aria-hidden="true"></span><span id="count-text">0 items detected</span></span>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="list" class="list" aria-live="polite"></main>

  <section id="empty" class="empty" hidden>
    <div class="empty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/>
        <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/>
      </svg>
    </div>
    <p id="empty-title" class="empty-title">No menu detected on this page yet</p>
    <p id="empty-body" class="empty-body">Keep browsing. We'll light up as soon as dishes show up.</p>
    <button id="rescan" class="button" type="button">Scan this page again</button>
  </section>

  <footer class="footer">Estimated ranges, not nutrition labels.</footer>

  <template id="card-template">
    <article class="card">
      <button class="card-button" type="button" aria-expanded="false">
        <div class="card-top">
          <h3 class="card-name"></h3>
          <span class="card-flag"></span>
        </div>
        <p class="card-desc"></p>
        <div class="card-row"></div>
      </button>
      <div class="card-detail" hidden>
        <p class="detail-head"></p>
        <p class="detail-body"></p>
      </div>
    </article>
  </template>

  <script src="sidepanel.js"></script>
</body>
</html>
